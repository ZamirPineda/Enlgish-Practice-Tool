name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm install" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --immutable" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "No lockfile found (package-lock.json, pnpm-lock.yaml, yarn.lock)." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Setup pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 9

      - name: Setup yarn
        if: steps.pm.outputs.manager == 'yarn'
        run: corepack enable

      - name: Restore Vite cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.vite
          key: ${{ runner.os }}-vite-${{ steps.pm.outputs.manager }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ steps.pm.outputs.manager }}-

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Typecheck
        run: ${{ steps.pm.outputs.manager }} run typecheck

      - name: Lint
        run: ${{ steps.pm.outputs.manager }} run lint

      - name: Test
        run: ${{ steps.pm.outputs.manager }} run test:ci -- --coverage

      - name: Install Playwright browsers
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: github.event_name == 'pull_request'
        run: ${{ steps.pm.outputs.manager }} run test:e2e

      - name: Upload Playwright artifacts
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

      - name: Build
        run: ${{ steps.pm.outputs.manager }} run build
