<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com https://firestore.googleapis.com ws://*:*; object-src 'none'; base-uri 'self';"
    />
    <title>English Practice Pal</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }

      :root {
        --color-bg: #0f172a;
        --color-surface-1: #1e293b;
        --color-surface-2: #0f172a;
        --color-surface-hover: #334155;
        --color-border: #334155;
        --color-text-primary: #f8fafc;
        --color-text-secondary: #cbd5e1;
        --color-text-muted: #94a3b8;
        --color-accent: #0284c7;
        --color-accent-hover: #0ea5e9;
        --color-success: #059669;
        --color-success-hover: #10b981;
        --color-focus: #38bdf8;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --radius-sm: 0.375rem;
        --radius-md: 0.625rem;
        --radius-lg: 0.875rem;
        --radius-xl: 1.25rem;
        --shadow-sm: 0 1px 2px rgba(2, 6, 23, 0.35);
        --shadow-md: 0 10px 25px rgba(2, 6, 23, 0.35);
        --font-sans:
          Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans",
          sans-serif;
        --text-xs: 0.75rem;
        --text-sm: 0.875rem;
        --text-md: 1rem;
        --text-lg: 1.125rem;
      }
      :root[data-theme="light"] {
        --color-bg: #f8fafc;
        --color-surface-1: #ffffff;
        --color-surface-2: #e2e8f0;
        --color-surface-hover: #cbd5e1;
        --color-border: #cbd5e1;
        --color-text-primary: #0f172a;
        --color-text-secondary: #334155;
        --color-text-muted: #64748b;
        --color-accent: #0284c7;
        --color-accent-hover: #0369a1;
      }
      :root[data-reduced-motion="reduce"] * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--color-bg);
        color: var(--color-text-primary);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
